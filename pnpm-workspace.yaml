# pnpm settings migrated from package.json's `pnpm` field, which pnpm 11+ no
# longer reads. Holds dependency overrides (security patches), build-script
# allowlist, supported architectures, and peer-dependency rules.

overrides:
  # Target must be >=0.28.1, not >=0.25.0: pnpm matches override selectors
  # against the DECLARED range, so this entry catches @esbuild-kit/core-utils'
  # '~0.18.20' and is the only override that ever fires for it. Pointing it at
  # >=0.25.0 landed on 0.27.7, which is inside GHSA-g7r4-m6w7-qqqr's range.
  'esbuild@<=0.24.2': '>=0.28.1'
  # GHSA-g7r4-m6w7-qqqr. Became reachable once vite moved to 7.3.6, which pulls
  # esbuild 0.27.7 into the tree; the pre-bump tree only had 0.25.12/0.27.1.
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1'
  'brace-expansion@>=1.0.0 <=1.1.11': '>=1.1.12'
  'brace-expansion@>=2.0.0 <2.0.3': '>=2.0.3 <3.0.0'
  # GHSA-3jxr-9vmj-r5cp (high). Range is >=3.0.0 <5.0.7, so the 2.1.0 copy in
  # the tree is NOT affected and is deliberately left alone.
  'brace-expansion@>=4.0.0 <5.0.7': '>=5.0.7 <6.0.0'
  'prismjs@<1.30.0': '>=1.30.0'
  'axios@=1.10.0': '>=1.11.0'
  # GHSA-52cp-r559-cp3m (high) + GHSA-h67p-54hq-rp68
  'js-yaml@>=4.0.0 <4.3.0': '>=4.3.0 <5.0.0'
  'playwright@<1.55.1': '>=1.55.1'
  'qs@<6.15.2': '>=6.15.2'
  # GHSA-23hp-3jrh-7fpw (critical), GHSA-8x88-c5mf-7j5w, GHSA-w8wr-v893-vjvp
  'tar@<7.5.19': '>=7.5.19 <8.0.0'
  'fast-xml-parser@<5.3.5': '>=5.3.5'
  'minimatch@>=3.0.0 <3.1.3': '>=3.1.3 <4.0.0'
  'minimatch@>=9.0.0 <9.0.6': '>=9.0.6 <10.0.0'
  'minimatch@>=10.0.0 <10.2.3': '>=10.2.3 <11.0.0'
  # GHSA-88fw-hqm2-52qc (high) + 6 medium advisories
  'hono@<4.12.27': '>=4.12.27 <5.0.0'
  'ajv@>=8.0.0 <8.18.0': '>=8.18.0'
  'ajv@<6.14.0': '>=6.14.0 <7.0.0'
  'langsmith@<0.6.0': '>=0.6.0 <0.7.0'
  # GHSA-4c8g-83qw-93j6 + GHSA-v2hh-gcrm-f6hx (high)
  'fast-uri@<3.1.4': '>=3.1.4 <4.0.0'
  'ip-address@<10.1.1': '>=10.1.1 <11.0.0'
  'uuid@<11.1.1': '>=11.1.1 <12.0.0'
  'uuid@>=13.0.0 <13.0.1': '>=13.0.1 <14.0.0'
  '@isaacs/brace-expansion@<5.0.1': '>=5.0.1'
  'webpack@>=5.49.0 <5.104.1': '>=5.104.1'
  'rollup@>=4.0.0 <4.59.0': '>=4.59.0'
  'preact@>=10.28.0 <10.28.2': '>=10.28.2'
  'serialize-javascript@<7.0.5': '>=7.0.5'
  'path-to-regexp@>=2.0.0 <3.3.0': '>=3.3.0'
  'path-to-regexp@>=0.2.0 <1.9.0': '>=1.9.0'
  'path-to-regexp@>=8.0.0 <8.4.0': '>=8.4.0'
  'yaml@>=2.0.0 <2.7.1': '>=2.7.1'
  'picomatch@<4.0.4': '>=4.0.4'
  'flatted@<3.4.2': '>=3.4.2'
  # GHSA-frvp-7c67-39w9: path traversal in serve-static, only patched in 2.x.
  # Legitimate because @modelcontextprotocol/sdk 1.30.0 widened its range to
  # '^1.19.9 || ^2.0.5'; this override REQUIRES the SDK at >=1.30.0.
  '@hono/node-server@<2.0.5': '>=2.0.5 <3.0.0'
  'express-rate-limit@>=8.2.0 <8.2.2': '>=8.2.2'
  'underscore@<1.13.8': '>=1.13.8'
  '@xmldom/xmldom@<0.8.13': '>=0.8.13'
  # GHSA-j3f2-48v5-ccww, reached via @google/genai
  'protobufjs@<7.6.5': '>=7.6.5 <8.0.0'
  'vite@>=7.0.0 <7.3.6': '>=7.3.6 <8.0.0'
  'lodash@<4.18.0': '>=4.18.0 <5.0.0'
  # GHSA-c2j3-45gr-mqc4
  'dompurify@<3.4.12': '>=3.4.12 <4.0.0'
  '@opentelemetry/core@<2.8.0': '>=2.8.0 <3.0.0'
  'postcss@<8.5.10': '>=8.5.10'
  'ws@>=8.0.0 <8.20.1': '>=8.20.1 <9.0.0'
  'smol-toml@<1.6.1': '>=1.6.1'
  # GHSA-xmf8-cvqr-rfgj (high), GHSA-7rqj-j65f-68wh (critical), GHSA-x445-f3h2-j279
  # reached via @auth/drizzle-adapter (next-auth itself is bumped directly).
  '@auth/core@<0.41.3': '>=0.41.3 <0.42.0'
  # GHSA-f88m-g3jw-g9cj (high), reached via next
  'sharp@<0.35.0': '>=0.35.0 <0.36.0'
  # GHSA-v422-hmwv-36x6, reached via express 5.x
  'body-parser@>=2.0.0 <2.3.0': '>=2.3.0 <3.0.0'
  # GHSA-4x5r-pxfx-6jf8 (advisory range <=7.29.0; the 7.28.5 copy is affected too)
  '@babel/core@<7.29.6': '>=7.29.6 <8.0.0'

onlyBuiltDependencies:
  - '@zvec/zvec'
  - '@zvec/bindings-linux-x64'
  - '@zvec/bindings-linux-arm64'
  - '@zvec/bindings-darwin-arm64'
  - 'bcrypt'
  - 'esbuild'
  - 'sharp'

ignoredBuiltDependencies:
  - 'bcrypt'
  - 'esbuild'
  - 'sharp'

supportedArchitectures:
  os:
    - 'current'
    - 'linux'
    - 'darwin'
  cpu:
    - 'current'
    - 'x64'
    - 'arm64'

peerDependencyRules:
  allowedVersions:
    'react': '19'
    'react-dom': '19'
  ignoreMissing:
    - 'tree-sitter'

# Explicit build-script policy (pnpm 11). true = allowed to run lifecycle
# scripts; mirrors the original onlyBuiltDependencies allowlist.
allowBuilds:
  '@zvec/zvec': true
  bcrypt: true
  esbuild: true
  sharp: true
  '@sentry/cli': false
  canvas: false
  msw: false
  protobufjs: false
  unrs-resolver: false
