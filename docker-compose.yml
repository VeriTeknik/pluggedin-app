# Default self-host setup for end users.
#
# The app image is BUILT LOCALLY from ./Dockerfile — there is no prebuilt
# registry image for self-hosting, because the embedded zvec vector engine
# needs build-time flags/bindings that a generic prebuilt image cannot carry.
#
#   cp .env.example .env          # then set NEXTAUTH_SECRET, POSTGRES_PASSWORD
#   docker compose up --build -d  # first run builds the image (~10-15 min)
#   open http://localhost:12005
#
# POSTGRES_PASSWORD and REDIS_PASSWORD have no defaults on purpose: compose
# fails with a named error if they are unset, rather than silently starting a
# database that every reader of this repository has the password to.
#
# Postgres and Redis are published on 127.0.0.1 only. Docker's published ports
# default to 0.0.0.0 AND its iptables rules are evaluated before ufw/firewalld,
# so a bare '5432:5432' on a host with a public IP exposes the database to the
# internet regardless of the firewall. The app reaches both over the compose
# network by service name and does not need either port published at all; they
# stay bound to loopback so host tools (psql, GUI clients) still work.
#
# Production / hosted deployments use a DIFFERENT file — this is NOT the prod
# stack:
#   - docker-compose.production.yml  → pulls the prebuilt veriteknik/pluggedin image
#   - infra/docker-compose.yml       → Traefik + SOPS production stack
#
# See README "Quick Start → Docker" for details.

services:
  # One-shot database migration. Reuses the app image built below (no second
  # build) and exits when migrations are applied; the app waits for it.
  pluggedin-migrate:
    container_name: pluggedin-migrate
    image: pluggedin-app:local
    # Run drizzle-kit directly from node_modules — the runtime image ships it
    # (drizzle-kit is kept in the image) and this avoids depending on a package
    # manager being present in the production runtime.
    command: ["node_modules/.bin/drizzle-kit", "migrate"]
    env_file:
      - .env
    environment:
      - "DATABASE_URL=postgresql://pluggedin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@pluggedin-postgres:5432/pluggedin"
      - DATABASE_SSL=false
    depends_on:
      pluggedin-postgres:
        condition: service_healthy
    restart: "no"

  pluggedin-app:
    container_name: pluggedin-app
    build:
      context: .
      dockerfile: Dockerfile
    image: pluggedin-app:local
    env_file:
      - .env
    restart: always
    ports:
      - '12005:3000'
    volumes:
      - mcp-cache:/app/.cache
      - app-uploads:/app/uploads
      - app-logs:/app/logs
      - zvec-data:/app/data/vectors
    environment:
      - NODE_ENV=production
      - "DATABASE_URL=postgresql://pluggedin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@pluggedin-postgres:5432/pluggedin"
      - DATABASE_SSL=false
      # ioredis parses the password out of the URL userinfo; the empty username
      # before the colon is required by the redis:// scheme.
      - "REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (see .env.example)}@pluggedin-redis:6379"
      - NEXTAUTH_URL=http://localhost:12005
      - MCP_ISOLATION_TYPE=none
      - MCP_ISOLATION_FALLBACK=firejail
      - MCP_ENABLE_NETWORK_ISOLATION=false
      - MCP_PACKAGE_STORE_DIR=/app/.cache/mcp-packages
      - MCP_PNPM_STORE_DIR=/app/.cache/mcp-packages/pnpm-store
      - MCP_UV_CACHE_DIR=/app/.cache/mcp-packages/uv-cache
      - ZVEC_DATA_PATH=/app/data/vectors
      # Set ENABLE_RAG=true in .env to enable RAG vector search
    depends_on:
      pluggedin-postgres:
        condition: service_healthy
      pluggedin-redis:
        condition: service_healthy
      pluggedin-migrate:
        condition: service_completed_successfully

  pluggedin-postgres:
    container_name: pluggedin-postgres
    # pgvector image provides the vector extension needed by the memory system
    image: pgvector/pgvector:pg18
    restart: always
    environment:
      POSTGRES_DB: pluggedin
      POSTGRES_USER: pluggedin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      # postgres:18 moved the default PGDATA out of /var/lib/postgresql/data;
      # pin it back to the mounted path so data persists in the volume and the
      # server actually initialises there (otherwise it boots in a throwaway
      # location and the healthcheck never passes).
      PGDATA: /var/lib/postgresql/data
    ports:
      # Loopback-only. See the header note on Docker bypassing host firewalls.
      - '127.0.0.1:5432:5432'
    volumes:
      - pluggedin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluggedin -d pluggedin"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  pluggedin-redis:
    container_name: pluggedin-redis
    image: redis:7-alpine
    restart: always
    ports:
      # Loopback-only. See the header note on Docker bypassing host firewalls.
      - '127.0.0.1:6379:6379'
    volumes:
      - pluggedin-redis:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (see .env.example)}
    # $$ escapes compose interpolation so the shell inside the container expands
    # REDIS_PASSWORD from its own environment. The password therefore stays out
    # of `docker inspect .Config.Cmd` and out of the container's process argv
    # (verified: /proc/1/cmdline reads just `redis-server *:6379`). It is still
    # rendered in the `environment:` blocks of `docker compose config` output,
    # which is unavoidable — treat that output as secret-bearing.
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pluggedin-postgres:
    driver: local
  pluggedin-redis:
    driver: local
  mcp-cache:
    driver: local
  app-uploads:
    driver: local
  app-logs:
    driver: local
  zvec-data:
    driver: local
