name: Build image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'db/**'
      - 'public/**'
      - 'scripts/**'
      # infra/** is here so the `Validate compose + scripts` job runs on
      # PRs that touch only the compose stack, Traefik/Ofelia config, or
      # the operational scripts. PR image builds run in `pr-build` on a
      # GitHub-hosted VM; the self-hosted `build` job never runs for PRs.
      - 'infra/**'
      - '.dockerignore'
      # The root compose files were absent from this list, so a PR touching
      # only the stack end users actually run got zero compose validation.
      - 'docker-compose*.yml'
      - '.env.example'
      - '.github/workflows/build-image.yml'
      - '.github/scripts/**'
  workflow_dispatch:

# Default to read-only token. The build job re-grants packages:write
# explicitly; pr-build gets packages:read for the cache. Other jobs (stack-validate) inherit the read-only default,
# so a compromised checkout in those jobs can't push branches, comment
# on PRs, or write to packages.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: veriteknik/pluggedin-app

jobs:
  build:
    # Runs on the self-hosted runner set up by
    # infra/scripts/isolate-gha-runner.sh on the prod host. The host's CPU has
    # the AVX2/AVX-512 instructions @zvec/zvec's native binding ships;
    # GitHub-hosted runners did not, and the build hit SIGILL inconsistently
    # depending on which Xeon Actions allocated.
    #
    # SECURITY: this is a persistent self-hosted runner on a public repo's
    # prod box. It must only ever execute code that is already on a protected
    # ref, so this job runs for pushes (main and v* tags — see `on.push`) and
    # for manual dispatches of main or a v* tag, and NEVER for pull_request.
    # PR builds run on a disposable GitHub-hosted VM in `pr-build` below.
    #
    # Why the PR path moved rather than being guarded: for pull_request
    # events GitHub evaluates the workflow file from the PR's merge ref, so an
    # `if:` like the old `head.repo.full_name == github.repository` check is
    # editable by the very PR it is meant to stop — a fork can delete it, or
    # add its own job with these runner labels. Nothing written in this file
    # can stop that; only platform controls can:
    #   1. Settings → Actions → General → "Approval for running fork pull
    #      request workflows from contributors": "Require approval for all
    #      external contributors". Never approve a fork run whose diff touches
    #      .github/.
    #   2. Preferably, register the runner in an organisation runner group
    #      restricted to "Selected workflows":
    #        VeriTeknik/pluggedin-app/.github/workflows/build-image.yml@refs/heads/main
    #      so no other workflow file or ref can schedule onto it at all.
    # Runner labels are scheduling selectors, not authorization.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    # The workflow's default `permissions:` is read-only above; packages:write
    # is re-granted here for this job alone.
    permissions:
      contents: read
      packages: write
    #
    # If the self-hosted runner is offline the job stays queued — that's a
    # signal to either bring the runner back or trigger a build elsewhere.
    runs-on: [self-hosted, linux, x64, plugged-in-prod]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave the token in .git/config on a persistent runner.
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only protected refs reach this job, so only they refresh the
          # shared registry cache.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1

  pr-build:
    name: Build + smoke-test (GitHub-hosted)
    # Untrusted code — pull requests, including forks, and manual dispatches
    # of any other branch — is built on a throwaway GitHub-hosted VM, never on
    # the production runner. Load-only: nothing is pushed and the registry
    # cache is read, not written, so a PR cannot poison what `build` ships.
    #
    # Caveat carried over from the move to self-hosted: some GitHub-hosted
    # CPUs lack the AVX-512 paths of the zvec binding. The Dockerfile no
    # longer loads the binding at build time, so this is expected to pass; if
    # it flakes with SIGILL, that is a PR-CI problem only and never affects
    # what is published.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # Read-only: lets the login below pull the registry cache. A fork PR's
      # token is read-only regardless.
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (cache read)
        # The cache import fails with 403 on an anonymous token, so log in
        # even though nothing is pushed.
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: pluggedin-app:pr-smoke
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          build-args: |
            NEXT_TELEMETRY_DISABLED=1

      - name: Smoke-test the built image
        run: |
          set -euo pipefail
          # `set -e` inside: without it only the LAST check's status counted.
          docker run --rm --entrypoint /bin/sh pluggedin-app:pr-smoke -c '
            set -e
            node --version
            tsx --version
            test -f /app/server.js
            test -d /app/.next/static
            test -d /app/drizzle
            test -x /usr/bin/bwrap
            # The image must not carry env files from the build context.
            leaked=$(ls -A /app | grep -E "^\.env" | grep -vx ".env.example" || true)
            if [ -n "$leaked" ]; then echo "env files shipped in the image: $leaked" >&2; exit 1; fi
          '

  stack-validate:
    name: Validate compose + scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: docker compose config
        run: |
          set -euo pipefail
          # The compose file references /run/sops/secrets.env which doesn't
          # exist in CI; create a minimal stub so `compose config` can resolve
          # env_file without erroring.
          sudo mkdir -p /run/sops
          {
            echo "POSTGRES_DB=v220_prod"
            echo "POSTGRES_USER=pluggedin"
            echo "POSTGRES_PASSWORD=stub"
          } | sudo tee /run/sops/secrets.env >/dev/null
          docker compose -f infra/docker-compose.yml config -q

      # Only infra/docker-compose.yml was validated here. The three root compose
      # files — including the default self-host stack end users run — were never
      # parsed in CI, which is how an insecure default shipped unnoticed.
      # Services declare `env_file: - .env`, which compose requires to EXIST as a
      # file even though interpolation is fed from --env-file /dev/null. The stub
      # is deliberately EMPTY: it satisfies env_file without contributing to
      # interpolation, which the fail-closed assertion below depends on.
      - name: Stub .env for compose validation
        run: |
          set -euo pipefail
          test ! -s .env
          : > .env

      - name: Validate root compose files
        run: |
          set -euo pipefail
          # Throwaway per-run values, generated rather than hardcoded so there is
          # no literal password in this file for a secret scanner to flag.
          export POSTGRES_PASSWORD REDIS_PASSWORD DB_PASSWORD
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          REDIS_PASSWORD=$(openssl rand -hex 16)
          DB_PASSWORD=$(openssl rand -hex 16)
          for f in docker-compose.yml docker-compose.dev.yml docker-compose.production.yml; do
            echo "== $f =="
            docker compose --env-file /dev/null -f "$f" config -q
          done

      - name: Assert self-host stack refuses to start without passwords
        run: |
          set -euo pipefail
          # POSTGRES_PASSWORD/REDIS_PASSWORD are deliberately default-less, so a
          # self-hoster cannot end up running a database whose password is in
          # this repository. Prove the fail-closed interpolation still bites.
          # No passwords are exported here and the .env stub is empty, so both
          # interpolation sources are genuinely absent.
          if docker compose --env-file /dev/null -f docker-compose.yml config -q 2>/dev/null; then
            echo "::error file=docker-compose.yml::rendered without POSTGRES_PASSWORD/REDIS_PASSWORD — the required-variable guard was weakened"
            exit 1
          fi
          echo "ok: docker-compose.yml fails closed when passwords are unset"

      - name: Assert datastores are not published beyond loopback
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD REDIS_PASSWORD DB_PASSWORD
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          REDIS_PASSWORD=$(openssl rand -hex 16)
          DB_PASSWORD=$(openssl rand -hex 16)
          rendered=()
          for f in docker-compose.yml docker-compose.dev.yml docker-compose.production.yml; do
            out="${RUNNER_TEMP}/${f}.json"
            docker compose --env-file /dev/null -f "$f" config --format json > "$out"
            rendered+=("$out")
          done
          python3 .github/scripts/assert_compose_ports.py "${rendered[@]}"

      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./infra/scripts
          severity: warning

      - name: Validate Traefik static config
        run: |
          set -euo pipefail
          # Must match the image infra/docker-compose.yml pins. Traefik
          # pins its Docker client to API 1.24 through v3.5, which Docker
          # Engine 29 rejects outright, so the stack runs v3.7 — validating
          # against v3.2 here would be checking a version we deliberately
          # cannot run.
          docker run --rm -v "$PWD/infra/traefik:/etc/traefik:ro" \
            traefik:v3.7 traefik --configfile=/etc/traefik/traefik.yml --help \
            > /dev/null

      - name: Lint Ofelia config (basic INI parse)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import configparser, sys
          c = configparser.ConfigParser(strict=False)
          c.read('infra/ofelia/config.ini')
          assert any(s.startswith('job-') for s in c.sections()), 'no jobs in ofelia config'
          PY
