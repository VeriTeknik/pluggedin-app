# SOPS creation rules. When you run `sops <file>`, SOPS looks here to decide
# how to encrypt new files.
#
# The age recipient (public key) below is the *deploy* key — it lives on the
# production host at /etc/sops/age/keys.txt and Traefik's compose service
# mounts it into containers that need to decrypt. The recipient is safe to
# commit; only the private key is sensitive and never leaves the host.
#
# To rotate keys see docs/ops/sops-rotation.md and the rotate-keys.sh script.

creation_rules:
  # Everything under infra/sops/ is encrypted with the production deploy key
  # plus the offsite-backup key. Adding a second recipient gives us a way
  # back if we ever lose the primary.
  # Matches the encrypted artefacts (`secrets.env.sops`), not this config
  # file and not `*.sops.example`. The `.sops` suffix is required: an
  # earlier version anchored on `\.(env|yaml)$`, which silently matched
  # nothing, so newly created files fell through to sops' "no matching
  # creation rule" error.
  #
  # This file must live at the REPO ROOT, not in infra/sops/. sops searches
  # for .sops.yaml upward from the working directory, and matches path_regex
  # against the path as given. With the config inside infra/sops/, neither
  # location worked: from the repo root sops reported "Config file not
  # found", and from inside the directory it found the config but matched
  # against a bare filename and reported "no matching creation rules found".
  # `sops updatekeys` was unusable either way.
  - path_regex: infra/sops/.*\.(env|yaml|yml|json)\.sops$
    encrypted_regex: "^(.*)$"
    # Generated at Phase 0 (2026-07-31). Public recipients only — safe to
    # commit. The matching private keys live at:
    #   deploy → /etc/sops/age/keys.txt on the production host
    #   backup → offline storage only (ops password manager); it must NOT
    #            remain on this host once it has been backed up.
    age: >-
      age1p4myv5mt35qwa3jrcdfp36pm8l94ylk89un3t5ln8u8ev32e5vxscjh5sd,
      age1elr0qckr3fsc8crasjfj9pc3jgscc78jhzzcq23zwjddmgzacqhqgldsqx
