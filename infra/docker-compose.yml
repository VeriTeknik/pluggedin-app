# Plugged.in production stack.
#
# Run with the wrapper:
#   infra/scripts/deploy.sh
# which decrypts infra/sops/secrets.env.sops into /run/sops/secrets.env
# (tmpfs) and exports IMAGE_TAG before invoking compose. Running compose
# by hand without the wrapper will fail: the secrets file and the staged
# Traefik dynamic config both live under /run/sops and are produced by
# deploy.sh.
#
# Single host, single app instance. Traefik is the only thing bound to
# host ports 80/443. Routing rules and per-route middlewares live in
# the `labels:` block on pluggedin-app — five sub-routers translate
# the production nginx site directly:
#
#   plugged-in            main → app, security-headers + rate-limit
#   plugged-in-sse        /api/discover/stream/ → app, 3600s timeouts
#   plugged-in-static     /_next/static/ → app, immutable cache headers
#   plugged-in-blog-imgs  /blog-images/ → app, 30d cache headers
#   plugged-in-widget     /widget.js → app, CORS middleware

x-app-environment: &app-env
  NODE_ENV: production
  # Secrets are NOT in this container's environment. They are mounted as a
  # file and loaded into the Node process at startup instead, because
  # anything in `environment:`/`env_file:` lands in Docker's Config.Env and
  # is readable by anything that can reach the Docker API — which includes
  # Traefik through the socket proxy, since the docker provider needs
  # container inspect to read routing labels.
  #
  # NODE_OPTIONS applies to every node process in the image, so `server.js`,
  # `drizzle-kit migrate` and the re-encryption script all get the secrets
  # without each invocation having to remember a flag.
  NODE_OPTIONS: "-r dotenv/config"
  DOTENV_CONFIG_PATH: /run/secrets/app.env
  # The bug class that triggered the docker migration: ZVEC_DATA_PATH
  # was not propagating from workspace .env into the standalone build.
  # In the container the mounted secrets file is the single source of
  # truth, but we still set ZVEC_DATA_PATH here so the value is visible in
  # `docker compose config` and impossible to forget on a fresh deploy.
  ZVEC_DATA_PATH: /app/data/vectors
  ZVEC_ALLOW_EXTERNAL_PATH: "false"
  MCP_PACKAGE_STORE_DIR: /app/.cache/mcp-packages
  MCP_PNPM_STORE_DIR: /app/.cache/mcp-packages/pnpm-store
  MCP_UV_CACHE_DIR: /app/.cache/mcp-packages/uv-cache
  MCP_ISOLATION_TYPE: bubblewrap
  MCP_ISOLATION_FALLBACK: none
  MCP_ENABLE_NETWORK_ISOLATION: "false"
  REDIS_URL: redis://redis:6379
  UPLOADS_DIR: /app/uploads

services:
  traefik:
    # v3.7 is a hard floor, not a preference. Traefik pins its Docker client
    # to API 1.24 up to and including v3.5; Docker Engine 29 dropped
    # everything below 1.40. On the older images the docker provider fails
    # every poll with "client version 1.24 is too old", so NO label-based
    # router is ever discovered — and because Traefik reports that as a
    # provider error while its own healthcheck stays green, the failure mode
    # is a site-wide 404 behind a healthy container. Verified here: v3.3,
    # v3.4 and v3.5 all reproduce it; v3.7.9 does not.
    # DOCKER_API_VERSION does not help — the pin overrides the environment.
    image: traefik:v3.7
    restart: always
    container_name: traefik
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      # Defaults are the production ports, so an ordinary `deploy.sh` on the
      # prod host is always correct. Only the pre-cutover phases, where the
      # native nginx still owns 80/443, override these:
      #   TRAEFIK_HTTP_PORT=8080 TRAEFIK_HTTPS_PORT=8443 docker compose up -d
      # Defaulting the other way round meant every post-cutover deploy would
      # silently drop the site back to :8080 unless the operator remembered
      # to edit this block back.
      # Ordering at cutover: nginx must release :80 before Traefik claims it,
      # because LE HTTP-01 validates over the public :80.
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      # traefik.yml is static config, read once at start and never watched,
      # so mounting it from the working tree is safe. The dynamic directory
      # is NOT mounted here — it is staged into /run/sops/traefik-dynamic by
      # deploy.sh, out of reach of git. See providers.file in traefik.yml.
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-acme:/letsencrypt
      - /run/sops:/run/sops:ro
      # No docker.sock here any more — router discovery goes through
      # docker-socket-proxy, which denies every POST. See that service.
    networks:
      - pluggedin
      - dockerproxy
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Gatekeeper in front of the Docker API.
  #
  # Traefik previously mounted /var/run/docker.sock directly. The `:ro` on
  # that mount is close to meaningless: it makes the socket *file* read-only,
  # not the API. Measured against the live stack before this change, that
  # access could read 108 environment variables off pluggedin-app — 28 of
  # them secret-bearing, including provider API keys — and POST
  # /containers/create was reachable, which is one bind-mount of / away from
  # root on the host. SOPS encryption at rest buys nothing against that path.
  #
  # This proxy exposes only what Traefik's docker provider actually calls,
  # and POST=0 denies every mutating request, so container creation is gone.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: always
    container_name: docker-socket-proxy
    environment:
      # Read-only endpoints the provider needs: list/inspect containers,
      # resolve networks, negotiate the API version, and watch for changes.
      CONTAINERS: "1"
      NETWORKS: "1"
      EVENTS: "1"
      VERSION: "1"
      # Everything else denied. POST=0 is the one that matters most.
      POST: "0"
      IMAGES: "0"
      VOLUMES: "0"
      EXEC: "0"
      SERVICES: "0"
      TASKS: "0"
      SWARM: "0"
      NODES: "0"
      SECRETS: "0"
      CONFIGS: "0"
      PLUGINS: "0"
      SYSTEM: "0"
      INFO: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      DISTRIBUTION: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dockerproxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:2375/version"]
      interval: 15s
      timeout: 5s
      retries: 3

  pluggedin-app:
    image: ghcr.io/veriteknik/pluggedin-app:${IMAGE_TAG:-latest}
    restart: always
    container_name: pluggedin-app
    hostname: pluggedin-app
    environment:
      <<: *app-env
    volumes:
      # The decrypted secrets, as a file rather than environment. See the
      # NODE_OPTIONS note in x-app-environment above.
      - /run/sops/secrets.env:/run/secrets/app.env:ro
      - /home/pluggedin/zvec-data:/app/data/vectors:rw
      - /home/pluggedin/uploads:/app/uploads:rw
      - /var/mcp-packages:/app/.cache/mcp-packages:rw
      - /var/log/pluggedin:/app/logs:rw
    networks:
      - pluggedin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # bubblewrap drives MCP server sandboxing. To set up its own
    # unprivileged user namespace from inside a container, bubblewrap
    # needs CAP_SYS_ADMIN (for clone(CLONE_NEWUSER)) and the host
    # AppArmor profile relaxed — Debian's default `docker-default`
    # policy blocks userns-setup syscalls. The trade-off is documented
    # in docs/ops/docker-traefik-sops-migration.md §4 ("MCP sandboxing
    # inside container"); removing these will silently disable MCP
    # sandboxing for every server, not just one, so do not strip them
    # without checking that MCP_ISOLATION_TYPE fallback is acceptable.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      # These three together are what bubblewrap needs to build a sandbox
      # from inside a container. CAP_SYS_ADMIN + apparmor:unconfined alone
      # is NOT enough — measured on this host:
      #   apparmor only ................ pivot_root: Operation not permitted
      #   + seccomp:unconfined ......... Can't mount proc on /newroot/proc
      #   + systempaths:unconfined ..... works (SANDBOX_OK, pid=2 inside)
      #
      # The trade-off, stated plainly: this drops the container's own seccomp
      # filter and unmasks /proc. We take that deliberately, because
      # MCP_ISOLATION_FALLBACK=none means the alternative is running every
      # STDIO MCP server — arbitrary third-party code, holding user
      # credentials — with no isolation at all. A per-server sandbox is worth
      # more here than a filter on the app process, which runs our own code.
      #
      # If sandboxing is ever disabled again, drop CAP_SYS_ADMIN and these
      # two lines together: on their own they are cost with no benefit.
      - seccomp:unconfined
      # `systempaths` takes `=`, not `:` — the colon form is rejected by the
      # daemon with `invalid --security-opt`. It is not an apparmor/seccomp
      # style profile reference, it is a flag that unmasks the /proc paths
      # Docker hides by default, which bubblewrap needs to mount its own.
      - systempaths=unconfined
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      traefik.enable: "true"
      # Service definition — used by every router below.
      traefik.http.services.plugged-in.loadbalancer.server.port: "3000"
      traefik.http.services.plugged-in.loadbalancer.serverstransport: "app-transport@file"
      traefik.http.services.plugged-in.loadbalancer.healthcheck.path: "/api/health"
      traefik.http.services.plugged-in.loadbalancer.healthcheck.interval: "30s"
      #
      # Companion service used only by the SSE sub-router — same backend
      # port, different transport with 3600s timeouts and no idle close.
      traefik.http.services.plugged-in-sse.loadbalancer.server.port: "3000"
      traefik.http.services.plugged-in-sse.loadbalancer.serverstransport: "sse-transport@file"
      #
      # SSE sub-router. Trailing slash on the prefix is deliberate — without
      # it /api/discover/streamABC would also match, which is broader than
      # nginx's `location ~ ^/api/discover/stream/` semantics. Priority
      # 120 ensures we always win against the catchall.
      traefik.http.routers.plugged-in-sse.rule: "Host(`plugged.in`) && PathPrefix(`/api/discover/stream/`)"
      traefik.http.routers.plugged-in-sse.entrypoints: "websecure"
      traefik.http.routers.plugged-in-sse.tls.certresolver: "le"
      traefik.http.routers.plugged-in-sse.priority: "120"
      traefik.http.routers.plugged-in-sse.service: "plugged-in-sse"
      # rate-limit included: SSE connections live for up to an hour, so
      # without a rate-limit a single source could exhaust connection
      # slots cheaply.
      traefik.http.routers.plugged-in-sse.middlewares: "security-headers@file,rate-limit@file"
      #
      # /_next/static/* — immutable 1-year cache.
      traefik.http.routers.plugged-in-static.rule: "Host(`plugged.in`) && PathPrefix(`/_next/static`)"
      traefik.http.routers.plugged-in-static.entrypoints: "websecure"
      traefik.http.routers.plugged-in-static.tls.certresolver: "le"
      traefik.http.routers.plugged-in-static.priority: "110"
      traefik.http.routers.plugged-in-static.service: "plugged-in"
      traefik.http.routers.plugged-in-static.middlewares: "security-headers@file,cache-immutable@file,compress@file"
      #
      # /blog-images/* — 30-day cache.
      traefik.http.routers.plugged-in-blog-imgs.rule: "Host(`plugged.in`) && PathPrefix(`/blog-images`)"
      traefik.http.routers.plugged-in-blog-imgs.entrypoints: "websecure"
      traefik.http.routers.plugged-in-blog-imgs.tls.certresolver: "le"
      traefik.http.routers.plugged-in-blog-imgs.priority: "110"
      traefik.http.routers.plugged-in-blog-imgs.service: "plugged-in"
      traefik.http.routers.plugged-in-blog-imgs.middlewares: "security-headers@file,cache-30d@file,compress@file"
      #
      # /widget.js — CORS open for embedding from any origin.
      traefik.http.routers.plugged-in-widget.rule: "Host(`plugged.in`) && Path(`/widget.js`)"
      traefik.http.routers.plugged-in-widget.entrypoints: "websecure"
      traefik.http.routers.plugged-in-widget.tls.certresolver: "le"
      traefik.http.routers.plugged-in-widget.priority: "110"
      traefik.http.routers.plugged-in-widget.service: "plugged-in"
      # rate-limit on widget too: open CORS + publicly embeddable on any
      # origin makes this a cheap abuse target without it.
      traefik.http.routers.plugged-in-widget.middlewares: "security-headers@file,widget-cors@file,rate-limit@file,compress@file"
      #
      # Catchall — everything else on the host. Lowest priority on
      # purpose so the specific routers above always win.
      traefik.http.routers.plugged-in.rule: "Host(`plugged.in`)"
      traefik.http.routers.plugged-in.entrypoints: "websecure"
      traefik.http.routers.plugged-in.tls.certresolver: "le"
      traefik.http.routers.plugged-in.priority: "100"
      traefik.http.routers.plugged-in.service: "plugged-in"
      traefik.http.routers.plugged-in.middlewares: "security-headers@file,rate-limit@file,compress@file"

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-v220_prod}
      POSTGRES_USER: ${POSTGRES_USER:-pluggedin}
      # _FILE indirection keeps the password out of Config.Env. The official
      # image reads it only when initialising a fresh data directory, so on
      # an existing volume this is inert — but disaster recovery restores
      # into an empty volume, which is exactly when it matters.
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /run/sops/pg-password:/run/secrets/pg_password:ro
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    networks:
      - pluggedin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pluggedin} -d ${POSTGRES_DB:-v220_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - postgres
      # pg_stat_statements is a shared-memory module, not a plain extension.
      # postgres/init.sql runs `CREATE EXTENSION pg_stat_statements`, which
      # succeeds without this flag but leaves the view raising "must be
      # loaded via shared_preload_libraries" on every read. Changing this
      # requires a postgres restart, not a reload.
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=12GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=200
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=500ms

  redis:
    image: redis:7-alpine
    restart: always
    container_name: redis
    volumes:
      - redisdata:/data
    networks:
      - pluggedin
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ofelia:
    image: mcuadros/ofelia:0.3.13
    restart: always
    container_name: ofelia
    depends_on:
      pluggedin-app:
        condition: service_healthy
    command: daemon --config=/etc/ofelia/config.ini
    volumes:
      - ./ofelia/config.ini:/etc/ofelia/config.ini:ro
      # See TODO(docker-socket-proxy) on the traefik service. Same trade
      # applies here, smaller surface (Ofelia only calls /containers/exec
      # and /containers/json) so lower priority follow-up.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pluggedin

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  traefik-acme:
    driver: local

networks:
  pluggedin:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  # Traefik <-> docker-socket-proxy only. `internal: true` means no route to
  # or from the outside world, and pluggedin-app is deliberately NOT attached
  # — the app has no business reaching the Docker API at all.
  dockerproxy:
    driver: bridge
    internal: true
